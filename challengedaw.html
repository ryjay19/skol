<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beginner CSS Selectors Activity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Card Container -->
  <main id="profile-card">

    <header>
      <span class="badge">PRO</span>
      <h1>Ryan Joshua D. Bianzon</h1>
      <p class="subtitle">Cybersecurity Cadet</p>
    </header>

    <!-- Skills Section -->
    <section class="section">
      <h2>Core Skills</h2>
      <ul>
        <li>Network Security</li>
        <li>Python Scripting</li>
        <li>Ethical Hacking</li>
      </ul>
    </section>

    <!-- Social Links Section -->
    <section class="section">
      <h2>Connect</h2>
      <div class="links">
        <a href="https://github.com" target="_blank">GitHub</a>
        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        <a href="#contact">Send Email</a>
      </div>
    </section>

    <!-- Action Buttons -->
    <footer class="controls">
      <button class="btn primary" type="button">Hire Cadet</button>
      <button class="btn danger" type="button">Report Bug</button>
      <button class="btn" type="button" disabled>System Lock (Offline)</button>
    </footer>

  </main>

</body>
</html>
